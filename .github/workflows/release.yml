name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.cr.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: cr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Agent Hub ${{ github.ref_name }}" \
            --notes "## What's new

          See commits for details.

          ## Downloads

          | File | Platform |
          |------|----------|
          | \`agent-hub_*_x64-setup.exe\` | Windows (NSIS) |
          | \`agent-hub_*_x64_en-US.msi\` | Windows (MSI) |
          | \`agent-hub_*_amd64.deb\` | Linux (Debian/Ubuntu) |
          | \`agent-hub_*.AppImage\` | Linux (portable) |

          ## Install

          - **Windows:** download the \`.exe\`, run, follow prompts.
          - **Linux (.deb):** \`sudo dpkg -i agent-hub_*_amd64.deb\` (will pull WebKit2GTK 4.1 if missing).
          - **Linux (AppImage):** \`chmod +x agent-hub_*.AppImage && ./agent-hub_*.AppImage\`."

          ID=$(gh release view "${{ github.ref_name }}" --json id --jq '.id')
          echo "release_id=$ID" >> $GITHUB_OUTPUT

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: Release (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - run: npm ci

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing."
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing."
            exit 1
          fi

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
